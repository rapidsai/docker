name: Private candidate RAPIDS containers

on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
        type: string
      date:
        required: true
        type: string
      sha:
        required: true
        type: string
      build_type:
        default: release-candidate
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.build_type }}
  cancel-in-progress: false

jobs:
  candidate-matrix:
    if: ${{ inputs.build_type == 'release-candidate' && startsWith(github.ref_name, 'release-test-') }}
    runs-on: linux-amd64-cpu4
    permissions:
      contents: read
      id-token: write
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.matrix.outputs.version }}
      train: ${{ steps.context.outputs.train-sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Install isolated matrix tools
        run: |
          python3 -m venv "${RUNNER_TEMP}/container-matrix-tools"
          "${RUNNER_TEMP}/container-matrix-tools/bin/python" -m pip install PyYAML==6.0.3
          echo "${RUNNER_TEMP}/container-matrix-tools/bin" >> "${GITHUB_PATH}"
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: us-east-2
          role-duration-seconds: 3600
          role-to-assume: arn:aws:iam::279114543810:role/gha-oidc-rc-producer-${{ github.repository_id }}
      - uses: rapidsai/shared-actions/release-candidate-context@39fc31647bd5514c99fca7b0463d45c2446148b7
        id: context
        with:
          source-sha: ${{ inputs.sha }}
      - name: Resolve frozen train and complete image matrix
        id: matrix
        env:
          TRAIN_SHA256: ${{ steps.context.outputs.train-sha256 }}
          SOURCE_SHA: ${{ inputs.sha }}
          SOURCE_BRANCH: ${{ inputs.branch }}
          BUILD_DATE: ${{ inputs.date }}
        run: ci/resolve-candidate-train.sh
  candidate-images:
    needs: candidate-matrix
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.candidate-matrix.outputs.matrix) }}
    name: ${{ matrix.KIND }}, CUDA${{ matrix.CUDA_VER }}, py${{ matrix.PYTHON_VER }}, ${{ matrix.ARCH }}
    runs-on: linux-${{ matrix.ARCH }}-cpu4
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      RAPIDS_SHA: ${{ inputs.sha }}
      BUILD_DATE: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Install isolated Conda indexer
        run: |
          candidate_docker_config=$(mktemp -d "${RUNNER_TEMP}/candidate-docker-config.XXXXXX")
          echo "DOCKER_CONFIG=${candidate_docker_config}" >> "${GITHUB_ENV}"
          build_datetime="${BUILD_DATE//-/}"
          echo "RAPIDS_DATETIME_STRING=${build_datetime:2}000000" >> "${GITHUB_ENV}"
          python3 -m venv "${RUNNER_TEMP}/container-index-tools"
          "${RUNNER_TEMP}/container-index-tools/bin/python" -m pip install conda-index==0.13.0 PyYAML==6.0.3
          echo "${RUNNER_TEMP}/container-index-tools/bin" >> "${GITHUB_PATH}"
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: us-east-2
          role-duration-seconds: 3600
          role-to-assume: arn:aws:iam::279114543810:role/gha-oidc-rc-producer-${{ github.repository_id }}
      - name: Prepare frozen candidate dependency channel
        uses: rapidsai/shared-actions/release-candidate-dependencies@39fc31647bd5514c99fca7b0463d45c2446148b7
        env:
          RELEASE_CANDIDATE_SHARED_ACTIONS_REPOSITORY: rapidsai/shared-actions
          RELEASE_CANDIDATE_SHARED_ACTIONS_REVISION: 39fc31647bd5514c99fca7b0463d45c2446148b7
        with:
          candidate-train-sha256: ${{ needs.candidate-matrix.outputs.train }}
          artifact-family: container
          candidate-unit-id: container:rapids-docker
          implementation-mode: direct
          prepare-conda-channel: 'true'
          arch: ${{ matrix.ARCH }}
          cuda-version: ${{ matrix.CUDA_VER }}
          python-version: ${{ matrix.PYTHON_VER }}
      - name: Set up Docker Context for Buildx
        run: docker context create builders
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          buildkitd-config: /etc/buildkit/buildkitd.toml
          driver: docker-container
          endpoint: builders
          version: 'v0.36.1'
      - name: Build frozen aggregate and inject private package/source inputs
        env:
          ARCH: ${{ matrix.ARCH }}
          CUDA_VER: ${{ matrix.CUDA_VER }}
          PYTHON_VER: ${{ matrix.PYTHON_VER }}
          IMAGE_KIND: ${{ matrix.KIND }}
        run: python3 ci/candidate_containers.py prepare
      - name: Generate frozen build arguments
        id: args
        env:
          CPU_ARCH: ${{ matrix.ARCH }}
          CUDA_VER: ${{ matrix.CUDA_VER }}
          LINUX_DISTRO: ${{ matrix.LINUX_DISTRO }}
          LINUX_DISTRO_VER: ${{ matrix.LINUX_DISTRO_VER }}
          LINUX_VER: ${{ matrix.LINUX_VER }}
          PYTHON_VER: ${{ matrix.PYTHON_VER }}
          RAPIDS_VER: ${{ needs.candidate-matrix.outputs.version }}
        run: ci/compute-build-args.sh
      - name: Prepare local archive directory
        run: mkdir -p .release-candidate-artifacts/container
      - name: Build the real RAPIDS image to an OCI archive
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: context
          file: .candidate-state/candidate.Dockerfile
          target: ${{ matrix.KIND }}
          platforms: linux/${{ matrix.ARCH }}
          pull: true
          push: false
          build-args: ${{ steps.args.outputs.DOCKER_BUILD_ARGS }}
          tags: ${{ matrix.IMAGE_NAME }}:${{ matrix.IMAGE_TAG }}
          outputs: type=oci,dest=.release-candidate-artifacts/container/image.tar,oci-mediatypes=true
          provenance: false
          sbom: false
      - name: Freeze image package identity
        env:
          IMAGE_NAME: ${{ matrix.IMAGE_NAME }}
          IMAGE_TAG: ${{ matrix.IMAGE_TAG }}
          ARCH: ${{ matrix.ARCH }}
          CONTAINER_VERSION: ${{ needs.candidate-matrix.outputs.version }}
        run: ci/prepare-candidate-image.sh
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-region: us-east-2
          role-duration-seconds: 3600
          role-to-assume: arn:aws:iam::279114543810:role/gha-oidc-rc-producer-${{ github.repository_id }}
      - name: Publish run-bound private image catalog
        uses: rapidsai/shared-actions/release-catalog-dispatch@39fc31647bd5514c99fca7b0463d45c2446148b7
        with:
          config: >-
            {"release_catalog_key":"container:rapids-docker",
            "artifact_directory":".release-candidate-artifacts/container",
            "artifacts":[{"path":"*.tar.gz","package_identity_file":"package-identity.json"}]}
          source-artifact-name: rapids-docker-${{ strategy.job-index }}-${{ matrix.ARCH }}
          candidate-train-sha256: ${{ needs.candidate-matrix.outputs.train }}
          candidate-matrix-arch: ${{ matrix.ARCH }}
          candidate-matrix-cuda-version: ${{ matrix.CUDA_VER }}
          candidate-matrix-python-version: ${{ matrix.PYTHON_VER }}
          upload-to-s3: 'true'
